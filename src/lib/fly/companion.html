<!doctype html>
<!--
  The flight companion: a tick-off checklist for a tablet or second screen
  beside the simulator. One template for every aircraft, filled in by
  src/routes/fly/[aircraft=aircraft]/+server.ts, which substitutes %name%,
  %slug% and the checklist payload from scripts/build-companion.mjs.

  It lives outside the printer shell on purpose: the shell is a reading frame,
  and this is an instrument. It borrows the cockpit's ECAM conventions instead
  of the site's tokens, so cyan is a value to set, green is done or as
  expected, and amber is something to wait for.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<title>%name% Flight Companion - luojiahai</title>
<meta name="description" content="A gate to gate tick-off checklist for the %name% in Microsoft Flight Simulator, with the light matrix, abbreviations and VATSIM radio scripts.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap">
<script>
  try {
    const scheme = JSON.parse(localStorage.getItem("fly.scheme.v1"));
    if (scheme === "dark" || scheme === "light") document.documentElement.dataset.scheme = scheme;
  } catch {}
</script>
<style>
  :root {
    color-scheme: light dark;
    --paper: light-dark(#e9edf0, #000000);
    --surface: light-dark(#f7f9fa, #0a0d10);
    --raised: light-dark(#dde3e8, #151a1f);
    --ink: light-dark(#0b0f13, #ffffff);
    --muted: light-dark(#46525c, #a9b3bc);
    --faint: light-dark(#535f69, #86909a);
    --line: light-dark(rgba(11, 15, 19, .14), rgba(255, 255, 255, .13));
    --cyan: light-dark(#00657f, #2fd6ff);
    --green: light-dark(#176b26, #3ee05a);
    --amber: light-dark(#8a4f00, #ffad1f);
    --tint: light-dark(rgba(0, 101, 127, .08), rgba(47, 214, 255, .08));
    --shadow: light-dark(rgba(11, 15, 19, .2), rgba(0, 0, 0, .65));
    --mono: "B612 Mono", ui-monospace, "SF Mono", monospace;
    --ui: "B612", system-ui, sans-serif;
    --rail: 220px;
  }
  :root[data-scheme="dark"] { color-scheme: dark; }
  :root[data-scheme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.45 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; }
  ::selection { background: color-mix(in srgb, var(--cyan) 30%, transparent); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  h1:focus { outline: none; }
  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .skip {
    position: fixed; left: 12px; top: 10px; z-index: 90; padding: 8px 12px;
    background: var(--cyan); color: var(--paper); font: 700 12px var(--ui);
    transform: translateY(-200%);
  }
  .skip:focus { transform: none; }
  svg { display: block; width: 16px; height: 16px; flex: none; }
  kbd {
    padding: 1px 4px; border: 1px solid var(--line); border-radius: 2px;
    color: var(--muted); font: 400 10px var(--mono);
  }
  b[data-tip] { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }

  .app {
    display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100dvh;
  }

  /* ---------- header ---------- */
  header {
    grid-column: 1 / -1; grid-row: 1; position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "brand prog tools util";
    align-items: center; gap: 10px 16px; padding: 10px 16px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .brand { grid-area: brand; display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .lamp {
    width: 10px; height: 10px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px color-mix(in srgb, var(--green) 55%, transparent);
  }
  .brand b { display: block; font: 700 13px/1.2 var(--ui); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .brand small { display: block; color: var(--muted); font: 400 11px/1.3 var(--ui); letter-spacing: .08em; }

  .prog { grid-area: prog; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .segs { flex: 1; display: flex; gap: 3px; height: 8px; min-width: 0; }
  .segs i { flex: 1 1 0; min-width: 2px; border-radius: 1px; background: linear-gradient(90deg, var(--green) var(--p), var(--raised) 0); }
  .segs i.cur { outline: 1.5px solid var(--cyan); outline-offset: 2px; }
  .total { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .tools, .util { display: flex; align-items: center; gap: 6px; }
  .tools { grid-area: tools; }
  .util { grid-area: util; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
  .seg button {
    min-height: 34px; padding: 0 12px; border: 0; border-radius: 2px; background: none; cursor: pointer;
    color: var(--muted); font: 700 12px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .hbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    min-width: 40px; height: 40px; padding: 0 11px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 2px; background: var(--surface);
    color: var(--muted); font: 700 12px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
  }
  .hbtn:hover { color: var(--ink); }
  .hbtn[aria-expanded="true"] { color: var(--ink); border-color: var(--cyan); }

  .rail {
    grid-column: 1; grid-row: 2 / 4; align-self: start;
    position: sticky; top: var(--hh, 61px); max-height: calc(100dvh - var(--hh, 61px));
    overflow-y: auto; padding: 14px 10px; border-right: 1px solid var(--line);
  }
  .rail button {
    display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center;
    width: 100%; min-height: 48px; padding: 8px; cursor: pointer; text-align: left;
    border: 0; border-radius: 2px; background: none; color: var(--muted); font: 400 14px/1.25 var(--ui);
  }
  .rail button:hover { color: var(--ink); background: color-mix(in srgb, var(--raised) 60%, transparent); }
  .rail .n, .rail .pc { color: var(--faint); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }
  .rail .done .pc { color: var(--green); }
  .rail [aria-current] { background: var(--raised); color: var(--ink); box-shadow: inset 3px 0 0 var(--cyan); }
  .rail [aria-current] .n { color: var(--cyan); }

  main { grid-column: 2; grid-row: 2; min-width: 0; padding: 22px 28px 40px; container: main / inline-size; }
  main > * { max-width: 1100px; }
  h1 { margin: 0 0 6px; font: 700 22px/1.2 var(--mono); letter-spacing: .03em; text-transform: uppercase; }
  .lede { margin: 0 0 14px; max-width: 66ch; color: var(--muted); }

  .lights {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 8px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
  }
  .lights .lbl { margin-right: 4px; color: var(--muted); font: 700 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; }
  .lights .when { margin: 0 2px 0 8px; color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 8px; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 2px; font-size: 13px;
  }
  .chip b { color: var(--cyan); font-weight: 700; }
  .chip[data-tip] { cursor: help; }

  .grp { margin-top: 24px; }
  .ghead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .ghead h2, .ghead .gt {
    flex: 1; display: flex; align-items: center; gap: 10px; margin: 0;
    color: var(--muted); font: 700 12px/1.3 var(--ui); letter-spacing: .14em; text-transform: uppercase;
  }
  .ghead h2::after, .ghead .gt::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .ct { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ct.ok { color: var(--green); }
  .notes {
    min-height: 30px; padding: 0 10px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line); border-radius: 2px; background: var(--surface);
    color: var(--muted); font: 400 12px var(--ui);
  }
  [data-mode="learn"] .notes { display: none; }
  [data-mode="fly"] .grp:not(.open) .prose { display: none; }

  .prose, #ref-panel .prose { max-width: 66ch; margin: 8px 0 12px; color: var(--muted); }
  .prose p, .prose ol, .prose ul { margin: 0 0 8px; }
  .prose ol, .prose ul { padding-left: 22px; }
  .prose li { margin-bottom: 4px; }
  .prose b { color: var(--ink); }
  .note { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--cyan); background: var(--surface); }

  .rows { border-top: 1px solid var(--line); }
  .line { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 36px; border-bottom: 1px solid var(--line); }
  .line.next { background: var(--tint); }
  .line.next::before {
    content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px;
    border-radius: 1px; background: var(--cyan);
  }
  .row {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, .9fr);
    gap: 4px 14px; align-items: start; padding: 12px 4px; cursor: pointer;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .row:hover { background: color-mix(in srgb, var(--raised) 50%, transparent); }
  .row.cursor, .row:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .box { width: 22px; height: 22px; display: grid; place-items: center; border: 2px solid var(--faint); border-radius: 2px; }
  [aria-checked="true"] > .box { background: var(--green); border-color: var(--green); }
  [aria-checked="true"] > .box::after {
    content: ""; width: 10px; height: 5px; border: solid var(--paper); border-width: 0 0 2.5px 2.5px;
    transform: translateY(-1px) rotate(-45deg);
  }
  .full { display: block; margin-top: 2px; color: var(--faint); font-size: 12px; }
  .act b { color: var(--cyan); font-weight: 700; }
  .verify .act b { color: var(--green); }
  .badge {
    display: inline-block; margin-right: 7px; padding: 1px 4px; vertical-align: 2px;
    border: 1px solid currentColor; border-radius: 2px; color: var(--green);
    font: 700 10px/1.3 var(--ui); letter-spacing: .1em; text-transform: uppercase;
  }
  .cond { color: var(--muted); font-size: 13px; }
  .cl { display: block; color: var(--amber); font: 700 10px/1.5 var(--ui); letter-spacing: .1em; text-transform: uppercase; }
  .row[aria-checked="true"],
  .row[aria-checked="true"] :is(.act b, .badge, .cond, .cl) { color: var(--faint); }
  .row[aria-checked="true"] .name { text-decoration: line-through; }
  .doc {
    display: grid; place-items: center; width: 32px; height: 32px; margin-top: 7px;
    border-radius: 2px; color: var(--faint); text-decoration: none;
  }
  .doc:hover { color: var(--cyan); background: var(--raised); }

  .endcard {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 28px; padding: 16px; border: 1px dashed var(--line); border-radius: 2px; color: var(--muted);
  }
  .endcard.ok { border-style: solid; border-color: var(--green); color: var(--ink); }
  .bigbtn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 2px; background: var(--surface);
    color: var(--ink); font: 700 14px/1 var(--ui); letter-spacing: .04em;
  }
  .bigbtn.go { background: var(--green); border-color: var(--green); color: var(--paper); }

  .bar {
    grid-column: 2; grid-row: 3; position: sticky; bottom: 0; z-index: 15;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--paper); border-top: 1px solid var(--line);
  }
  #next-label {
    flex: 1 1 220px; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font-size: 13px;
  }
  #next-label b { color: var(--ink); }
  .keys { order: 3; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 11px; white-space: nowrap; }
  @media (pointer: coarse) { .keys { display: none; } }

  .ref {
    grid-column: 3; grid-row: 2 / 4; align-self: start;
    position: sticky; top: var(--hh, 61px); height: calc(100dvh - var(--hh, 61px));
    display: flex; flex-direction: column; width: min(460px, 38vw);
    background: var(--surface); border-left: 1px solid var(--line);
  }
  .ref-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .ref-tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
  [role="tab"] {
    min-height: 36px; padding: 0 10px; cursor: pointer; white-space: nowrap;
    border: 0; border-radius: 2px; background: none;
    color: var(--muted); font: 700 12px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
  }
  [role="tab"][aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 0 -2px 0 var(--cyan); }
  #ref-panel { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 40px; font-size: 13px; }
  #ref-panel h2 { margin: 0 0 12px; font: 700 15px/1.3 var(--mono); letter-spacing: .03em; text-transform: uppercase; }
  #ref-panel h3 { margin: 18px 0 8px; color: var(--muted); font: 700 11px var(--ui); letter-spacing: .12em; text-transform: uppercase; }
  .scroll { overflow-x: auto; margin-bottom: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 5px 8px 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; font-weight: 400; }
  thead th { color: var(--muted); font-size: 11px; }
  td { color: var(--muted); }
  td.val { color: var(--cyan); }
  td.nil { color: var(--faint); }
  .hl { background: var(--tint); }
  .filter, .fields input {
    width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 2px;
    background: var(--paper); color: var(--ink); font: 400 14px var(--mono); letter-spacing: 0; text-transform: none;
  }
  .filter { margin-bottom: 8px; }
  input::placeholder { color: var(--faint); }
  input:focus-visible { outline-offset: 0; }
  .empty { color: var(--muted); }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .fields label { display: grid; gap: 4px; color: var(--muted); font: 400 11px var(--ui); letter-spacing: .06em; text-transform: uppercase; }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  .chain b { padding: 2px 7px; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); font-weight: 400; }
  .ex { margin: 0 0 10px; padding: 10px; border: 1px solid var(--line); border-radius: 2px; }
  .ex h4 { margin: 0 0 6px; font: 700 12px var(--ui); }
  .turn { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; padding: 3px 0; }
  .who { color: var(--muted); font: 700 10px/1.8 var(--ui); letter-spacing: .1em; text-transform: uppercase; }
  .who small { display: block; font-weight: 400; line-height: 1.2; letter-spacing: 0; text-transform: none; }
  .you .who { color: var(--cyan); }
  .atc .say { color: var(--muted); }
  .fill { color: var(--cyan); font-weight: 700; }
  .tok { color: var(--faint); border-bottom: 1px dashed currentColor; }

  #tip {
    position: fixed; z-index: 80; max-width: min(300px, 80vw); padding: 7px 10px; pointer-events: none;
    background: var(--ink); color: var(--paper); border-radius: 2px; box-shadow: 0 8px 24px var(--shadow);
    font: 400 13px/1.4 var(--ui); white-space: pre-line;
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--bh, 70px) + 14px); z-index: 70; transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 6px 6px 6px 16px;
    background: var(--ink); color: var(--paper); border-radius: 2px; box-shadow: 0 8px 24px var(--shadow);
    font: 700 14px var(--ui);
  }
  #toast button {
    min-height: 34px; padding: 0 14px; cursor: pointer; border: 0; border-radius: 2px;
    background: var(--paper); color: var(--ink); font: 700 13px var(--ui);
  }
  #toast button:focus-visible { outline-color: var(--paper); }

  @media (max-width: 1020px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
    header { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand tools util" "prog prog prog"; }
    .tools { justify-self: end; }
    .rail {
      grid-row: 2; z-index: 12; max-height: none; display: flex; gap: 2px; padding: 4px 10px;
      overflow-x: auto; scrollbar-width: none; border-right: 0; border-bottom: 1px solid var(--line); background: var(--paper);
    }
    .rail::-webkit-scrollbar { display: none; }
    .rail button { flex: none; display: inline-flex; width: auto; min-height: 44px; padding: 0 12px; white-space: nowrap; }
    .rail .pc { display: none; }
    .rail .done .pc { display: inline; }
    .rail [aria-current] { box-shadow: inset 0 -3px 0 var(--cyan); }
    main { grid-column: 1; grid-row: 3; padding: 16px 16px 32px; }
    .bar { grid-column: 1; grid-row: 4; }
    .hbtn .lbl { display: none; }
    .total { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .ref {
      position: fixed; inset: auto 0 0; z-index: 40; width: auto; height: 72dvh;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
      box-shadow: 0 -20px 60px var(--shadow);
    }
    @media (prefers-reduced-motion: no-preference) {
      .ref { animation: rise .22s cubic-bezier(.16, 1, .3, 1); }
    }
  }
  @keyframes rise { from { transform: translateY(32px); opacity: 0; } }

  /* An open reference panel narrows main as much as a phone does. */
  @container main (max-width: 640px) {
    .row { grid-template-columns: 26px minmax(0, 1fr); }
    .row > .box { grid-row: 1 / span 3; }
    .row > :not(.box) { grid-column: 2; }
    .cond:empty { display: none; }
    .cl { display: inline; margin-right: 6px; }
  }

  @media (max-width: 720px) {
    header {
      grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "brand brand util" "tools tools tools" "prog prog prog";
      padding: 8px 12px;
    }
    .util { justify-self: end; }
    .tools { justify-self: start; }
    .brand small { display: none; }
    .turn { grid-template-columns: 1fr; gap: 2px; }
    .who small { display: inline; margin-left: 6px; }
    /* Under 16px iOS Safari zooms in on focus and never zooms back out. */
    .filter, .fields input { font-size: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  @media print {
    header, .rail, .bar, .ref, .doc, .notes, #tip, #toast, .skip { display: none !important; }
    .app { display: block; }
    main { padding: 0; }
    * { color: #000 !important; background: #fff !important; box-shadow: none !important; }
    .prose { display: block !important; }
    [aria-checked="true"] > .box::after { border-color: #000; }
  }
</style>
</head>
<body>

<a class="skip" href="#phase-title" data-act="skip">Skip to checklist</a>

<div class="app">
  <header>
    <a class="brand" href="/">
      <span class="lamp" aria-hidden="true"></span>
      <span><b>%name%</b><small>Flight companion</small></span>
    </a>
    <div class="prog">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <span class="total" id="total"></span>
    </div>
    <!-- Lucide glyphs (@lucide/svelte 1.28.0), inlined because this page ships
         outside the Svelte bundle. Nothing syncs them with src/lib/icons.ts, so
         a Lucide upgrade that redraws them has to be copied here by hand. -->
    <div class="tools">
      <div class="seg" role="group" aria-label="Detail">
        <button data-act="mode" data-mode="fly" aria-pressed="true" title="Steps only, notes on demand">Fly</button>
        <button data-act="mode" data-mode="learn" aria-pressed="false" title="Every note and explanation">Learn</button>
      </div>
      <button class="hbtn" data-act="ref" data-ref="lights" aria-label="Lights" aria-controls="ref" aria-expanded="false" aria-keyshortcuts="L" title="Lights (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        <span class="lbl">Lights</span>
      </button>
      <button class="hbtn" data-act="ref" data-ref="atc" aria-label="Radio" aria-controls="ref" aria-expanded="false" aria-keyshortcuts="R" title="Radio (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.247 7.761a6 6 0 0 1 0 8.478"/><path d="M19.075 4.933a10 10 0 0 1 0 14.134"/><path d="M4.925 19.067a10 10 0 0 1 0-14.134"/><path d="M7.753 16.239a6 6 0 0 1 0-8.478"/><circle cx="12" cy="12" r="2"/></svg>
        <span class="lbl">Radio</span>
      </button>
      <button class="hbtn" data-act="ref" data-ref="abbreviations" aria-label="Abbreviations" aria-controls="ref" aria-expanded="false" aria-keyshortcuts="A" title="Abbreviations (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/></svg>
        <span class="lbl">Abbrev.</span>
      </button>
    </div>
    <div class="util">
      <button class="hbtn" id="scheme" data-act="scheme"></button>
      <button class="hbtn" data-act="reset" aria-label="Reset flight" title="Reset flight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span class="lbl">Reset</span>
      </button>
    </div>
  </header>

  <nav class="rail" id="rail" aria-label="Flight phases"></nav>

  <main id="main"></main>

  <aside class="ref" id="ref" aria-label="Reference" hidden>
    <div class="ref-head">
      <div class="ref-tabs" id="ref-tabs" role="tablist" aria-label="Reference sheets"></div>
      <button class="hbtn" data-act="close" aria-label="Close reference" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="ref-panel" role="tabpanel" tabindex="0"></div>
  </aside>

  <div class="bar" id="bar">
    <p id="next-label"></p>
    <span class="keys" aria-hidden="true">
      <span><kbd>J</kbd> <kbd>K</kbd> move</span>
      <span><kbd>Space</kbd> tick</span>
      <span><kbd>1</kbd>–<kbd>9</kbd> phase</span>
      <span><kbd>L</kbd> <kbd>R</kbd> <kbd>A</kbd> reference</span>
      <span><kbd>Esc</kbd> close</span>
    </span>
    <button class="bigbtn go" id="tick-next" data-act="tick-next">✓ Tick</button>
    <button class="bigbtn go" id="next-phase" data-act="next-phase" hidden>Next phase →</button>
  </div>
</div>

<div id="tip" role="tooltip" hidden></div>
<div id="toast" role="status" hidden><span id="toast-msg"></span><button data-act="undo">Undo</button></div>
<div class="sr" id="live" aria-live="polite"></div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(() => {
  "use strict";

  const SLUG = "%slug%";
  const LS = {
    ticks: "fly." + SLUG + ".ticks.v2",
    fields: "fly." + SLUG + ".fields.v1",
    phase: "fly." + SLUG + ".phase.v1",
    mode: "fly.mode.v1",
    scheme: "fly.scheme.v1",
  };
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const REFS = [
    { id: "lights", key: "l", label: "Lights" },
    { id: "atc", key: "r", label: "Radio" },
    { id: "abbreviations", key: "a", label: "Abbreviations" },
  ];
  const icon = paths =>
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
  const SCHEMES = {
    auto: { next: "dark", label: "Auto", icon: icon('<circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/>') },
    dark: { next: "light", label: "Dark", paper: "#000000", icon: icon('<path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>') },
    light: { next: "auto", label: "Light", paper: "#e9edf0", icon: icon('<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>') },
  };
  const MODES = ["fly", "learn"];

  const $ = id => document.getElementById(id);
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = s => String(s).replace(/[&<>"']/g, c => ESC[c]);
  const plain = frag => (frag || []).map(n => n.v).join("");
  const pick = (value, allowed, fallback) => (allowed.includes(value) ? value : fallback);
  const coarse = matchMedia("(pointer: coarse)");
  const fine = matchMedia("(pointer: fine)");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const prefersDark = matchMedia("(prefers-color-scheme: dark)");
  const glide = () => (still.matches ? "instant" : "smooth");

  let DATA;
  try {
    DATA = JSON.parse($("data").textContent);
  } catch {
    $("main").innerHTML = '<p class="lede">Could not read the checklist data.</p>';
    return;
  }

  const PHASES = DATA.phases.map(p => {
    const groups = p.groups.map(g => ({ ...g, items: g.blocks.filter(b => b.type === "items").flatMap(b => b.items) }));
    return { ...p, groups, items: groups.flatMap(g => g.items) };
  });

  const S = {
    phase: 0,
    ticks: load(LS.ticks, {}),
    fields: load(LS.fields, {}),
    mode: pick(load(LS.mode, "fly"), MODES, "fly"),
    scheme: pick(load(LS.scheme, "auto"), Object.keys(SCHEMES), "auto"),
    ref: null,
    cursor: null,
    open: new Set(),
    filter: "",
  };

  const done = items => items.filter(i => S.ticks[i.id]).length;
  const nextItem = p => p.items.find(i => !S.ticks[i.id]);
  const phaseFromHash = () => PHASES.findIndex(p => p.id === decodeURIComponent(location.hash.slice(1)));
  const lines = () => [...$("main").querySelectorAll(".line")];

  /* Inside a row the whole row is one checkbox, and a checkbox's content is
     presentational: links flatten to text (the docs link sits beside the row)
     and tips stay out of the tab order, reached through the row's own focus. */
  function inline(frag, inRow) {
    return (frag || []).map(n => {
      const v = esc(n.v);
      if (n.t === "b") return n.tip ? '<b data-tip="' + esc(n.tip) + '"' + (inRow ? "" : ' tabindex="0"') + ">" + v + "</b>" : "<b>" + v + "</b>";
      if (n.t === "i") return "<i>" + v + "</i>";
      if (n.t === "sub") return "<sub>" + v + "</sub>";
      if (n.t === "link" && !inRow) return '<a href="' + esc(n.href) + '" target="_blank" rel="noopener">' + v + "</a>";
      return v;
    }).join("");
  }

  function proseHTML(b) {
    if (b.type === "para") return "<p>" + inline(b.frag) + "</p>";
    if (b.type === "note") return '<p class="note">' + inline(b.frag) + "</p>";
    if (b.type === "steps") return "<ol>" + b.items.map(f => "<li>" + inline(f) + "</li>").join("") + "</ol>";
    if (b.type === "bullets") return "<ul>" + b.items.map(f => "<li>" + inline(f) + "</li>").join("") + "</ul>";
    return "";
  }

  function renderChrome() {
    const root = document.documentElement;
    if (S.scheme === "auto") delete root.dataset.scheme; else root.dataset.scheme = S.scheme;
    const resolved = S.scheme === "auto" ? (prefersDark.matches ? "dark" : "light") : S.scheme;
    document.querySelector('meta[name="color-scheme"]').content = S.scheme === "auto" ? "light dark" : S.scheme;
    document.querySelector('meta[name="theme-color"]').content = SCHEMES[resolved].paper;
    const scheme = SCHEMES[S.scheme];
    $("scheme").innerHTML = scheme.icon + '<span class="lbl">' + scheme.label + "</span>";
    $("scheme").setAttribute("aria-label", "Colour scheme: " + scheme.label);
    $("scheme").title = "Colour scheme: " + scheme.label + " (Auto, Dark, Light)";

    root.dataset.mode = S.mode;
    document.querySelectorAll('[data-act="mode"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === S.mode)));
    document.querySelectorAll('[data-act="ref"]').forEach(b => b.setAttribute("aria-expanded", String(b.dataset.ref === S.ref)));
    $("ref").hidden = !S.ref;
  }

  function renderProgress() {
    let ticked = 0, total = 0;
    $("segs").innerHTML = PHASES.map((p, i) => {
      const c = done(p.items);
      ticked += c; total += p.items.length;
      return '<i style="flex-grow:' + p.items.length + ";--p:" + (p.items.length ? c / p.items.length * 100 : 0) + '%"' +
        (i === S.phase ? ' class="cur"' : "") + "></i>";
    }).join("");
    $("total").textContent = ticked + " / " + total;
  }

  function renderRail() {
    const nav = $("rail");
    if (!nav.children.length) {
      nav.innerHTML = PHASES.map((p, i) =>
        '<button data-act="phase" data-i="' + i + '" aria-keyshortcuts="' + (i + 1) + '">' +
        '<span class="n">' + esc(p.num) + '</span><span class="t">' + esc(p.short) + '</span><span class="pc"></span></button>').join("");
    }
    PHASES.forEach((p, i) => {
      const b = nav.children[i], c = done(p.items), complete = c === p.items.length;
      if (i === S.phase) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", complete);
      b.lastElementChild.textContent = complete ? "✓" : c + "/" + p.items.length;
    });
  }

  function revealPhase(behavior = glide()) {
    const nav = $("rail"), b = nav.children[S.phase];
    if (nav.scrollWidth > nav.clientWidth) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2, behavior });
    else if (nav.scrollHeight > nav.clientHeight) nav.scrollTo({ top: b.offsetTop - (nav.clientHeight - b.offsetHeight) / 2, behavior });
  }

  function lightsHTML(p) {
    if (!p.lights.length) return "";
    return '<div class="lights" role="group" aria-labelledby="lights-label"><span class="lbl" id="lights-label">Lights</span>' +
      p.lights.map(entry =>
        (p.lights.length > 1 ? '<span class="when">' + esc(entry.when) + "</span>" : "") +
        entry.set.map(s =>
          '<span class="chip"' + (s.full ? ' tabindex="0" data-tip="' + esc(s.full) + '"' : "") + ">" +
          esc(s.light) + " <b>" + esc(s.state) + "</b></span>").join("")).join("") +
      "</div>";
  }

  function rowHTML(it, label, n) {
    const href = (it.control.find(f => f.t === "link") || {}).href;
    const cl = label && label !== "Condition" ? '<span class="cl">' + esc(label) + "</span> " : "";
    return '<div class="line" data-id="' + esc(it.id) + '">' +
      '<div class="row' + (it.kind === "verify" ? " verify" : "") + '" role="checkbox" tabindex="0" data-act="tick" aria-checked="false"' +
        ' aria-labelledby="rn' + n + " ra" + n + '"' + (it.condition ? ' aria-describedby="rc' + n + '"' : "") + ">" +
        '<span class="box" aria-hidden="true"></span>' +
        '<span class="ctl"><span class="name" id="rn' + n + '">' + inline(it.control, true) + "</span>" +
          (it.full ? '<span class="full">' + esc(it.full) + "</span>" : "") + "</span>" +
        '<span class="act">' + (it.kind === "verify" ? '<span class="badge" aria-hidden="true">Verify</span>' : "") +
          '<span id="ra' + n + '">' + inline(it.action, true) + "</span></span>" +
        (it.condition ? '<span class="cond" id="rc' + n + '">' + cl + inline(it.condition, true) + "</span>" : '<span class="cond"></span>') +
      "</div>" +
      (href ? '<a class="doc" href="' + esc(href) + '" target="_blank" rel="noopener" title="Open in the FlyByWire docs"' +
        ' aria-label="' + esc(plain(it.control)) + ' in the FlyByWire docs">↗</a>' : "") +
    "</div>";
  }

  const notesLabel = (count, open) =>
    open ? "Hide notes" : '<span aria-hidden="true">ⓘ</span> ' + count + (count === 1 ? " note" : " notes");

  function groupHTML(g, gi, counter) {
    const key = S.phase + ":" + gi, open = S.open.has(key);
    const runs = [];
    let body = "", prose = [], blocks = 0;
    const flush = () => {
      if (!prose.length) return;
      const id = "prose-" + gi + "-" + runs.length;
      runs.push(id);
      blocks += prose.length;
      body += '<div class="prose" id="' + id + '">' + prose.map(proseHTML).join("") + "</div>";
      prose = [];
    };
    g.blocks.forEach(b => {
      if (b.type !== "items") return prose.push(b);
      flush();
      body += '<div class="rows">' + b.items.map(it => rowHTML(it, b.conditionLabel, counter.n++)).join("") + "</div>";
    });
    flush();

    const toggle = runs.length
      ? '<button class="notes" data-act="notes" data-key="' + key + '" data-count="' + blocks + '" aria-expanded="' + open +
        '" aria-controls="' + runs.join(" ") + '">' + notesLabel(blocks, open) + "</button>"
      : "";
    const head = g.title || toggle
      ? '<div class="ghead">' + (g.title ? "<h2>" + esc(g.title) + "</h2>" : '<span class="gt"></span>') +
        (g.items.length ? '<span class="ct"></span>' : "") + toggle + "</div>"
      : "";
    return '<section class="grp' + (open ? " open" : "") + '" data-g="' + gi + '">' + head + body + "</section>";
  }

  function renderMain() {
    const p = PHASES[S.phase], after = PHASES[S.phase + 1], counter = { n: 0 };
    hideTip();
    $("main").innerHTML =
      '<h1 id="phase-title" tabindex="-1">' + esc(p.title) + "</h1>" +
      (p.lede ? '<p class="lede">' + esc(p.lede) + "</p>" : "") +
      lightsHTML(p) +
      p.groups.map((g, gi) => groupHTML(g, gi, counter)).join("") +
      '<div class="endcard" id="endcard"><span id="end-msg"></span>' +
        (after
          ? '<button class="bigbtn" id="end-next" data-act="next-phase">Next: ' + esc(after.num) + " · " + esc(after.short) + " →</button>"
          : "<span>End of flight</span>") +
      "</div>";
  }

  const syncCursor = () =>
    lines().forEach(line => line.firstElementChild.classList.toggle("cursor", line.dataset.id === S.cursor));

  function syncMain() {
    const p = PHASES[S.phase], next = nextItem(p);
    lines().forEach(line => {
      line.firstElementChild.setAttribute("aria-checked", String(!!S.ticks[line.dataset.id]));
      line.classList.toggle("next", !!next && next.id === line.dataset.id);
    });
    syncCursor();
    $("main").querySelectorAll(".grp").forEach(sec => {
      const ct = sec.querySelector(".ct");
      if (!ct) return;
      const items = p.groups[sec.dataset.g].items, c = done(items);
      ct.textContent = c + "/" + items.length;
      ct.classList.toggle("ok", c === items.length);
    });
    const left = p.items.length - done(p.items);
    $("endcard").classList.toggle("ok", !left);
    $("end-msg").textContent = left ? left + (left === 1 ? " item" : " items") + " left in " + p.short : "✓ " + p.short + " complete";
    $("end-next")?.classList.toggle("go", !left);
  }

  function renderBar() {
    const p = PHASES[S.phase], nx = nextItem(p), after = PHASES[S.phase + 1];
    $("next-label").innerHTML = nx
      ? "Next: <b>" + esc(plain(nx.control)) + "</b> — " + esc(plain(nx.action))
      : "✓ " + esc(p.short) + " complete" + (after ? "" : " · end of flight");
    const tick = $("tick-next"), go = $("next-phase");
    const stranded = document.activeElement === tick && !nx;
    tick.hidden = !nx;
    go.hidden = !!nx || !after;
    if (stranded) (go.hidden ? $("phase-title") : go).focus({ preventScroll: true });
  }

  function sync() {
    syncMain();
    renderBar();
    renderProgress();
    renderRail();
  }

  function matrixHTML(b, highlight, lights) {
    const on = b.head.map(h => highlight.includes(h));
    return '<div class="scroll"><table><thead><tr>' +
      b.head.map((h, i) => '<th scope="col"' + (on[i] ? ' class="hl"' : "") + ">" + esc(h) + "</th>").join("") +
      "</tr></thead><tbody>" + b.rows.map((r, ri) => "<tr>" + r.map((c, ci) => {
        if (!ci) return '<th scope="row">' + esc(c) + (b.fulls?.[ri] ? '<span class="full">' + esc(b.fulls[ri]) + "</span>" : "") + "</th>";
        const nil = /^[-–]?$/.test(c);
        const cls = [on[ci] && "hl", nil ? "nil" : lights && !/required/i.test(c) && "val"].filter(Boolean).join(" ");
        return "<td" + (cls ? ' class="' + cls + '"' : "") + ">" + esc(c) + "</td>";
      }).join("") + "</tr>").join("") + "</tbody></table></div>";
  }

  function sayHTML(text) {
    return esc(text).replace(/\{([A-Z0-9 _+]+)\}/g, (m, tok) => {
      const v = (S.fields[tok] || "").trim();
      return v ? '<span class="fill">' + esc(v) + "</span>" : '<span class="tok">' + esc(tok.toLowerCase()) + "</span>";
    });
  }

  const exchangeHTML = b =>
    '<div class="ex">' + (b.title ? "<h4>" + esc(b.title) + "</h4>" : "") + b.turns.map(t =>
      '<div class="turn ' + (t.who === "You" ? "you" : "atc") + '">' +
        '<span class="who">' + esc(t.who) + (t.tag ? "<small>" + esc(t.tag) + "</small>" : "") + "</span>" +
        '<span class="say" data-text="' + esc(t.text) + '">' + sayHTML(t.text) + "</span></div>").join("") + "</div>";

  function sheetGroupsHTML(sheet, matrix) {
    return sheet.groups.map(g =>
      "<section>" + (g.title ? "<h3>" + esc(g.title) + "</h3>" : "") + g.blocks.map(b =>
        b.type === "matrix" ? matrix(b)
          : b.type === "exchange" ? exchangeHTML(b)
          : '<div class="prose">' + proseHTML(b) + "</div>").join("") + "</section>").join("");
  }

  const SHEETS = {
    lights: sheet => sheetGroupsHTML(sheet, b => matrixHTML(b, PHASES[S.phase].lights.map(e => e.when), true)),
    atc: sheet =>
      (sheet.chain ? '<p class="chain">' + sheet.chain.map(c => "<b>" + esc(c) + "</b>").join('<span aria-hidden="true">→</span>') + "</p>" : "") +
      '<div class="fields">' + DATA.tokens.map(t =>
        "<label>" + esc(t.label) + '<input data-tok="' + esc(t.key) + '" value="' + esc(S.fields[t.key] || "") +
        '" placeholder="' + esc(t.key.toLowerCase()) + '" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>').join("") +
      "</div>" + sheetGroupsHTML(sheet, () => ""),
    abbreviations: sheet =>
      '<input class="filter" id="ref-filter" type="search" value="' + esc(S.filter) + '" placeholder="Filter, e.g. FMA"' +
      ' aria-label="Filter abbreviations" autocomplete="off" autocapitalize="characters" spellcheck="false">' +
      sheetGroupsHTML(sheet, b => matrixHTML(b, [], false)) + '<p class="empty" id="ref-empty" hidden></p>',
  };

  function renderRef() {
    if (!S.ref) return;
    REFS.forEach(r => {
      const tab = $("tab-" + r.id), on = r.id === S.ref;
      tab.setAttribute("aria-selected", String(on));
      tab.tabIndex = on ? 0 : -1;
    });
    const panel = $("ref-panel"), sheet = DATA.refs[S.ref];
    const changed = panel.dataset.sheet !== S.ref;
    panel.dataset.sheet = S.ref;
    panel.setAttribute("aria-labelledby", "tab-" + S.ref);
    hideTip();
    panel.innerHTML = "<h2>" + esc(sheet.title) + "</h2>" + SHEETS[S.ref](sheet);
    if (changed) panel.scrollTop = 0;
    if (S.ref === "abbreviations") applyFilter();
  }

  function applyFilter() {
    const q = S.filter.trim().toLowerCase();
    let any = false;
    $("ref-panel").querySelectorAll("section").forEach(sec => {
      let shown = 0;
      sec.querySelectorAll("tbody tr").forEach(tr => {
        tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q);
        if (!tr.hidden) shown++;
      });
      sec.hidden = !shown;
      any ||= shown > 0;
    });
    $("ref-empty").hidden = any;
    $("ref-empty").textContent = "Nothing matches “" + S.filter.trim() + "”";
  }

  const renderSays = () =>
    document.querySelectorAll("#ref-panel .say").forEach(el => (el.innerHTML = sayHTML(el.dataset.text)));

  function syncFields() {
    document.querySelectorAll("[data-tok]").forEach(input => {
      if (input !== document.activeElement) input.value = S.fields[input.dataset.tok] || "";
    });
    renderSays();
  }

  function openRef(id) {
    if (S.ref === id) return;
    if (!S.ref) S.filter = "";
    S.ref = id;
    renderChrome();
    renderRef();
  }

  function closeRef() {
    if (!S.ref) return;
    const id = S.ref, hadFocus = $("ref").contains(document.activeElement);
    S.ref = null;
    hideTip();
    renderChrome();
    if (hadFocus) document.querySelector('[data-act="ref"][data-ref="' + id + '"]').focus();
  }

  function toggleRef(id) {
    if (S.ref === id) return closeRef();
    openRef(id);
    if (id === "abbreviations" && fine.matches) $("ref-filter").focus({ preventScroll: true });
  }

  let tipAnchor = null, tipOwner = null;

  function placeTip() {
    const tip = $("tip");
    if (tip.hidden) return;
    if (!tipAnchor.isConnected) return hideTip();
    tip.style.left = tip.style.top = "0px";
    const r = tipAnchor.getBoundingClientRect(), t = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 8)) + "px";
    tip.style.top = (r.top > t.height + 16 ? r.top - t.height - 7 : r.bottom + 7) + "px";
  }

  function showTip(anchor, text, owner = anchor) {
    hideTip();
    tipAnchor = anchor;
    tipOwner = owner;
    $("tip").textContent = text;
    $("tip").hidden = false;
    owner.setAttribute("aria-describedby", ((owner.getAttribute("aria-describedby") || "") + " tip").trim());
    placeTip();
  }

  function hideTip() {
    if ($("tip").hidden) return;
    $("tip").hidden = true;
    const rest = (tipOwner.getAttribute("aria-describedby") || "").split(" ").filter(id => id && id !== "tip").join(" ");
    if (rest) tipOwner.setAttribute("aria-describedby", rest); else tipOwner.removeAttribute("aria-describedby");
    tipAnchor = tipOwner = null;
  }

  function rowTip(row) {
    const terms = [...row.querySelectorAll("[data-tip]")];
    if (terms.length) showTip(terms[0], terms.map(t => t.textContent + ": " + t.dataset.tip).join("\n"), row);
  }

  function setPhase(i) {
    const hadFocus = $("main").contains(document.activeElement);
    S.phase = i;
    S.cursor = null;
    save(LS.phase, PHASES[i].id);
    renderMain();
    sync();
    if (S.ref === "lights") renderRef();
    window.scrollTo({ top: 0, behavior: "instant" });
    revealPhase();
    if (hadFocus) $("phase-title").focus({ preventScroll: true });
  }

  const goPhase = i => { if (PHASES[i]) location.hash = PHASES[i].id; };

  function setTick(id, on) {
    if (on) S.ticks[id] = true; else delete S.ticks[id];
    save(LS.ticks, S.ticks);
    sync();
    const p = PHASES[S.phase];
    $("live").textContent = p.short + " " + done(p.items) + " of " + p.items.length;
  }

  function reveal(id, focus) {
    const line = lines().find(l => l.dataset.id === id);
    if (!line) return;
    if (focus) line.firstElementChild.focus({ preventScroll: true });
    line.scrollIntoView({ block: "center", behavior: glide() });
  }

  function tickNext() {
    const p = PHASES[S.phase], nx = nextItem(p);
    if (!nx) return;
    setTick(nx.id, true);
    reveal(nextItem(p)?.id, false);
  }

  function moveCursorTo(id) {
    S.cursor = id;
    syncCursor();
    reveal(id, true);
  }

  function moveCursor(step) {
    const ids = lines().map(l => l.dataset.id);
    if (!ids.length) return;
    const at = ids.indexOf(S.cursor), nx = nextItem(PHASES[S.phase]);
    const target = at >= 0 ? Math.max(0, Math.min(ids.length - 1, at + step))
      : nx ? ids.indexOf(nx.id)
      : step > 0 ? 0 : ids.length - 1;
    moveCursorTo(ids[target]);
  }

  function tickCursor() {
    const ids = lines().map(l => l.dataset.id), at = ids.indexOf(S.cursor);
    if (at < 0) return tickNext();
    setTick(S.cursor, !S.ticks[S.cursor]);
    if (ids[at + 1]) moveCursorTo(ids[at + 1]);
  }

  function toggleNotes(button) {
    const key = button.dataset.key, open = !S.open.has(key);
    if (open) S.open.add(key); else S.open.delete(key);
    button.closest(".grp").classList.toggle("open", open);
    button.setAttribute("aria-expanded", String(open));
    button.innerHTML = notesLabel(Number(button.dataset.count), open);
  }

  let undo = null, toastTimer = 0;

  function toast(message, onUndo) {
    undo = onUndo;
    $("toast-msg").textContent = message;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }

  function hideToast() {
    const hadFocus = $("toast").contains(document.activeElement);
    $("toast").hidden = true;
    undo = null;
    if (hadFocus) document.querySelector('[data-act="reset"]').focus();
  }

  function restore(ticks, fields) {
    S.ticks = ticks;
    S.fields = fields;
    save(LS.ticks, ticks);
    save(LS.fields, fields);
    sync();
    syncFields();
  }

  function reset() {
    const before = { ticks: S.ticks, fields: S.fields };
    restore({}, {});
    toast("Flight reset", () => restore(before.ticks, before.fields));
  }

  const CLICKS = {
    tick: el => { const id = el.parentElement.dataset.id; S.cursor = id; setTick(id, !S.ticks[id]); },
    phase: el => goPhase(Number(el.dataset.i)),
    "next-phase": () => goPhase(S.phase + 1),
    "tick-next": tickNext,
    notes: toggleNotes,
    mode: el => { S.mode = el.dataset.mode; save(LS.mode, S.mode); renderChrome(); },
    scheme: () => { S.scheme = SCHEMES[S.scheme].next; save(LS.scheme, S.scheme); renderChrome(); },
    ref: el => toggleRef(el.dataset.ref),
    tab: el => openRef(el.dataset.ref),
    close: closeRef,
    reset,
    undo: () => { undo?.(); hideToast(); },
    skip: (el, e) => { e.preventDefault(); $("phase-title").focus(); },
  };

  document.addEventListener("click", e => {
    const term = coarse.matches && e.target.closest("[data-tip]");
    if (term) return tipAnchor === term ? hideTip() : showTip(term, term.dataset.tip);
    if (coarse.matches) hideTip();
    const el = e.target.closest("[data-act]");
    if (el) CLICKS[el.dataset.act](el, e);
  });

  const TAB_KEYS = {
    ArrowRight: i => i + 1,
    ArrowLeft: i => i - 1,
    Home: () => 0,
    End: () => REFS.length - 1,
  };

  const KEYS = {
    j: () => moveCursor(1),
    k: () => moveCursor(-1),
    " ": tickCursor,
    escape: () => { hideTip(); closeRef(); },
    ...Object.fromEntries(REFS.map(r => [r.key, () => toggleRef(r.id)])),
    ...Object.fromEntries(PHASES.map((p, i) => [String(i + 1), () => goPhase(i)])),
  };

  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t.matches("input:not([type=checkbox]):not([type=radio]), textarea, select")) {
      if (e.key === "Escape") t.blur();
      return;
    }
    const step = t.getAttribute("role") === "tab" && TAB_KEYS[e.key];
    if (step) {
      e.preventDefault();
      const next = REFS[(step(REFS.findIndex(r => r.id === S.ref)) + REFS.length) % REFS.length];
      openRef(next.id);
      $("tab-" + next.id).focus();
      return;
    }
    if (e.key === " " && t.matches("button, a")) return;
    const action = KEYS[e.key.toLowerCase()];
    if (!action) return;
    e.preventDefault();
    if (!(e.repeat && e.key === " ")) action();
  });

  document.addEventListener("focusin", e => {
    const row = e.target.closest(".row");
    if (row) { S.cursor = row.parentElement.dataset.id; syncCursor(); }
    if (!fine.matches) return;
    if (e.target.matches("[data-tip]")) showTip(e.target, e.target.dataset.tip);
    else if (row && row.matches(":focus-visible")) rowTip(row);
  });
  document.addEventListener("focusout", e => { if (e.target === tipOwner) hideTip(); });

  document.addEventListener("mouseover", e => {
    if (!fine.matches) return;
    const term = e.target.closest("[data-tip]");
    if (term && term !== tipAnchor) showTip(term, term.dataset.tip);
  });
  document.addEventListener("mouseout", e => {
    const term = e.target.closest("[data-tip]");
    if (term && term === tipAnchor && !term.contains(e.relatedTarget) && tipOwner !== document.activeElement) hideTip();
  });
  addEventListener("scroll", placeTip, { capture: true, passive: true });
  addEventListener("resize", placeTip);

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "ref-filter") { S.filter = t.value; applyFilter(); return; }
    if (!t.dataset.tok) return;
    S.fields[t.dataset.tok] = t.value;
    save(LS.fields, S.fields);
    renderSays();
  });

  addEventListener("hashchange", () => {
    const i = phaseFromHash();
    if (i >= 0 && i !== S.phase) setPhase(i);
  });

  addEventListener("storage", e => {
    if (e.key === LS.ticks) { S.ticks = load(LS.ticks, {}); sync(); }
    if (e.key === LS.fields) { S.fields = load(LS.fields, {}); syncFields(); }
  });

  prefersDark.addEventListener("change", renderChrome);

  const docked = new ResizeObserver(() => {
    const root = document.documentElement.style;
    root.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
    root.setProperty("--bh", $("bar").offsetHeight + "px");
  });
  docked.observe(document.querySelector("header"));
  docked.observe($("bar"));

  /* ---------- boot ---------- */
  $("ref-tabs").innerHTML = REFS.map(r =>
    '<button role="tab" id="tab-' + r.id + '" data-act="tab" data-ref="' + r.id + '" aria-controls="ref-panel"' +
    ' aria-selected="false" tabindex="-1" aria-keyshortcuts="' + r.key.toUpperCase() + '">' + esc(r.label) + "</button>").join("");

  const fromHash = phaseFromHash();
  S.phase = fromHash >= 0 ? fromHash : Math.max(0, PHASES.findIndex(p => p.id === load(LS.phase, "")));
  save(LS.phase, PHASES[S.phase].id);
  renderChrome();
  renderMain();
  sync();
  // B612 is wider than the fallback face, so the rail scrolls again once it lands.
  document.fonts.ready.then(() => revealPhase("instant"));
  if (fromHash < 0) location.replace("#" + PHASES[S.phase].id);
})();
</script>
</body>
</html>
