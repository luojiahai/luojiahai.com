<!doctype html>
<html lang="%lang%">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="%sveltekit.assets%/mask-icon.svg" color="#141413" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <meta name="theme-color" content="#d1cfc5" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        document.documentElement.classList.add("preload");
        window.addEventListener("load", function () {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.documentElement.classList.remove("preload");
            });
          });
        });
        try {
          var stored = localStorage.getItem("color-mode");
          var mode =
            stored === "system" || stored === "light" || stored === "dark"
              ? stored
              : "system";
          document.documentElement.dataset.colorMode = mode;
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute("content", dark ? "#141413" : "#d1cfc5");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=B612:ital,wght@0,400;0,700;1,400;1,700&family=B612+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
